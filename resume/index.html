    <style>
      .resume-card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 24px;
        margin-top: 24px;
        align-items: start;
      }

      .resume-card {
        position: relative;
        display: flex;
        flex-direction: column;
        height: auto;
        padding: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 8px 30px rgba(11, 43, 106, 0.06);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .new-card {
        display: block;
        min-height: auto;
        padding: 0 24px 40px;
        background: transparent;
        z-index: 1;
      }

      .new-card::before {
        display: none;
      }

      .resume-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 50px rgba(11, 43, 106, 0.12);
      }

      .resume-card__badge {
        position: absolute;
        top: 16px;
        right: 16px;
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .resume-card__badge.completed {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .resume-card__badge.extended {
        background: #ede9fe;
        color: #6d28d9;
      }

      .resume-card__badge.excellent {
        background: #fef3c7;
        color: #b45309;
      }

      .resume-card__badge.verified {
        background: #dcfce7;
        color: #15803d;
      }

      .resume-card__badge.incomplete {
        background: #fee2e2;
        color: #b91c1c;
      }

      .resume-card__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        height: 100%;
      }

      .resume-card__avatar-wrap {
        width: 96px;
        height: 96px;
        margin-bottom: 16px;
        padding: 4px;
        border-radius: 999px;
        background: #e2e8f0;
        box-shadow: inset 0 2px 10px rgba(15, 23, 42, 0.12);
      }

      .resume-card__avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 999px;
      }

      .resume-card__name {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.35;
        color: #0f172a;
      }

      .resume-card__role {
        margin: 8px 0 0;
        font-size: 0.95rem;
        color: #64748b;
      }

      .resume-card__rating {
        display: flex;
        gap: 4px;
        margin: 12px 0 14px;
        color: #f59e0b;
      }

      .resume-card__desc {
        margin: 0 0 18px;
        min-height: 42px;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #64748b;
        font-style: italic;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .resume-card__chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
      }

      .resume-card__chip {
        padding: 6px 10px;
        border-radius: 12px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
      }

      .resume-card__footer {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-top: 16px;
        margin-top: auto;
        border-top: 1px solid #e2e8f0;
      }

      .resume-card__links {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .resume-card__icon-link,
      .resume-card__reference {
        color: #64748b;
        text-decoration: none;
        transition: color 0.25s ease, opacity 0.25s ease;
      }

      .resume-card__icon-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: #f8fafc;
      }

      .resume-card__icon-link:hover,
      .resume-card__reference:hover {
        color: #1d4ed8;
      }

      .resume-card__icon-link.is-disabled {
        pointer-events: none;
        opacity: 0.45;
      }

      .resume-card__reference {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
      }

      .resume-card__button {
        width: 100%;
        margin-top: 20px;
        padding: 12px 16px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #1a2e5a, #274690);
        color: #ffffff;
        font-size: 0.92rem;
        font-weight: 600;
        box-shadow: 0 8px 20px rgba(26, 46, 90, 0.18);
        transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      }

      .resume-card__button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(26, 46, 90, 0.22);
      }

      .resume-card__button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* Pagination styling */
      #pagination .pagination {
        gap: 4px;
      }

      #pagination .page-link {
        border-radius: 50% !important;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        color: #333;
        border: 1px solid #dee2e6;
        transition: all 0.2s ease;
      }

      #pagination .page-item.active .page-link {
        background-color: #1a2e5a; /* warna biru gelap sesuai desain */
        border-color: #1a2e5a;
        color: #fff;
      }

      #pagination .page-item:not(.disabled):not(.active) .page-link:hover {
        background-color: #f0f4ff;
        border-color: #1a2e5a;
        color: #1a2e5a;
      }

      #pagination .page-item.disabled .page-link {
        background: transparent;
        border-color: transparent;
        color: #aaa;
        cursor: default;
      }
    </style>
  </head>
